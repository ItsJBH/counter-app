<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Counter App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    .count-animate {
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-slate-800/90 backdrop-blur-md rounded-3xl p-8 shadow-2xl border border-slate-700/50 text-center flex flex-col items-center">
    
    <!-- Title Section -->
    <div class="mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-500/10 text-indigo-400 mb-3 border border-indigo-500/20">
        <i class="fa-solid fa-calculator text-xl"></i>
      </div>
      <h1 class="text-xl font-bold text-slate-200">Counter</h1>
      <p class="text-xs text-slate-400 mt-0.5">Simple & Clean Increment App</p>
    </div>

    <div class="w-full bg-slate-950/60 rounded-2xl p-6 mb-8 border border-slate-800 shadow-inner flex items-center justify-center">
      <span id="counterValue" class="count-animate text-6xl font-extrabold tracking-tight text-white select-none">
        0
      </span>
    </div>

    <div class="grid grid-cols-2 gap-4 w-full mb-4">
      <!-- Decrement Button -->
      <button 
        id="decrementBtn"
        class="flex items-center justify-center gap-2 py-4 px-6 bg-rose-600/90 hover:bg-rose-500 active:scale-95 transition-all text-white font-semibold rounded-2xl shadow-lg shadow-rose-950/40 cursor-pointer touch-manipulation"
        aria-label="Decrement counter">
        <i class="fa-solid fa-minus text-lg"></i>
        <span>Minus</span>
      </button>

      <!-- Increment Button -->
      <button 
        id="incrementBtn"
        class="flex items-center justify-center gap-2 py-4 px-6 bg-emerald-600/90 hover:bg-emerald-500 active:scale-95 transition-all text-white font-semibold rounded-2xl shadow-lg shadow-emerald-950/40 cursor-pointer touch-manipulation"
        aria-label="Increment counter">
        <i class="fa-solid fa-plus text-lg"></i>
        <span>Plus</span>
      </button>
    </div>

    <!-- Reset Button -->
    <button 
      id="resetBtn"
      class="w-full py-2.5 px-4 bg-slate-700/50 hover:bg-slate-700 text-slate-300 hover:text-white transition-all text-xs font-semibold rounded-xl border border-slate-600/30 flex items-center justify-center gap-2 cursor-pointer">
      <i class="fa-solid fa-rotate-right"></i>
      <span>Reset Counter</span>
    </button>

    <!-- Keyboard Hint -->
    <p class="text-[11px] text-slate-500 mt-6 flex items-center gap-1">
      <i class="fa-regular fa-keyboard"></i> Use <span class="bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded text-[10px]">+</span> or <span class="bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded text-[10px]">-</span> on keyboard
    </p>

  </div>

  <script>
    // Initial State
    let count = 0;

    // DOM Elements
    const counterDisplay = document.getElementById('counterValue');
    const incrementBtn = document.getElementById('incrementBtn');
    const decrementBtn = document.getElementById('decrementBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Function to update display and animate
    function updateCounter(change = 0) {
      if (change === 1) {
        count++;
      } else if (change === -1) {
        count--;
      } else if (change === 0) {
        count = 0;
      }

      // Update text content
      counterDisplay.textContent = count;

      // Color indication based on value
      if (count > 0) {
        counterDisplay.className = "count-animate text-6xl font-extrabold tracking-tight text-emerald-400 select-none scale-105";
      } else if (count < 0) {
        counterDisplay.className = "count-animate text-6xl font-extrabold tracking-tight text-rose-400 select-none scale-105";
      } else {
        counterDisplay.className = "count-animate text-6xl font-extrabold tracking-tight text-white select-none scale-100";
      }

      // Reset animation scale after a short burst
      setTimeout(() => {
        counterDisplay.classList.remove('scale-105');
      }, 150);
    }

    // Event Listeners for Buttons
    incrementBtn.addEventListener('click', () => updateCounter(1));
    decrementBtn.addEventListener('click', () => updateCounter(-1));
    resetBtn.addEventListener('click', () => updateCounter(0));

    // Keyboard Shortcuts Support
    document.addEventListener('keydown', (e) => {
      if (e.key === '+' || e.key === '=' || e.key === 'ArrowUp') {
        updateCounter(1);
      } else if (e.key === '-' || e.key === '_' || e.key === 'ArrowDown') {
        updateCounter(-1);
      } else if (e.key === 'r' || e.key === 'R' || e.key === '0') {
        updateCounter(0);
      }
    });
  </script>
</body>
</html>
